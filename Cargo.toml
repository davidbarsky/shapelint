[workspace]
members = ["compiler"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
rust-version = "1.100"

[package]
name = "shapelint"
version.workspace = true
edition = "2024"
rust-version.workspace = true

[lib]
path = "src/lib.rs"
test = false
bench = false

[[bin]]
name = "shapelint"
path = "src/main.rs"
test = false
bench = false

[dependencies]
annotate-snippets = "0.12.17"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
glob = "0.3.4"
indexmap = "2.14.2"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
strsim = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
hegeltest = "0.54.2"
insta = "1.49.0"
tempfile = "3.27.0"

[package.metadata.rust-analyzer]
rustc_private = true
